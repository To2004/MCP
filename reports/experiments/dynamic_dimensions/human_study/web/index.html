<title>Bot Day Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow reading column; each screen is a single sheet, with the action bar
   pinned to the bottom so the next step is always one thumb away on a phone. A card's lines
   are three columns on a wide screen and stack (label, Usual, Today) on a phone. */
:root {
  --bg: #f1f4f2;
  --surface: #ffffff;
  --ink: #15201b;
  --muted: #55635c;
  --line: #d3dbd6;
  --accent: #1d6a5a;
  --accent-ink: #ffffff;
  --accent-soft: #e1eee9;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system,
    "Segoe UI", Roboto, sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas,
    monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412;
    --surface: #171e1b;
    --ink: #e4ebe7;
    --muted: #9eaba4;
    --line: #2b3631;
    --accent: #5fc4aa;
    --accent-ink: #0b1310;
    --accent-soft: #1b332c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412;
  --surface: #171e1b;
  --ink: #e4ebe7;
  --muted: #9eaba4;
  --line: #2b3631;
  --accent: #5fc4aa;
  --accent-ink: #0b1310;
  --accent-soft: #1b332c;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 0;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand {
  font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted);
}
.step { font-family: var(--font-mono); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }

h1 { font-size: 30px; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 21px; line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 65ch; }
ul, ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; max-width: 65ch; }
.lead { font-size: 19px; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap;
}

.sheet {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.notice { border-left: 4px solid var(--accent); padding: 4px 0 4px 12px; }
.who { font-size: 19px; font-weight: 700; line-height: 1.3; }
.when { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.notes { display: grid; gap: 6px; }
.note { font-size: 15px; }
.note b { font-weight: 600; }
.note.none { color: var(--muted); }

/* card lines */
.lines { display: grid; font-variant-numeric: tabular-nums; }
.lines-head, .line { display: grid; grid-template-columns: 30% 1fr 1fr; gap: 10px; }
.lines-head {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); padding-bottom: 6px;
}
.line { border-top: 1px solid var(--line); padding: 9px 0; font-size: 15px; line-height: 1.4; }
.line .lab { font-weight: 600; }
.line .k { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* pair lines: label, then Agent A and Agent B side by side */
.pair-head { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pline { border-top: 1px solid var(--line); padding: 9px 0; display: grid; gap: 6px; font-size: 15px; line-height: 1.4; }
.pline .lab { font-weight: 600; }
.pline .cells { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cell { display: grid; gap: 2px; }
.cell .k, .agent-chip {
  font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted);
}
.agent-chip { display: block; margin-bottom: 2px; }

fieldset { border: none; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
legend { font-weight: 700; font-size: 16px; padding: 0; margin-bottom: 8px; }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice, .tag, .btn {
  font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
}
.choice { font-size: 15px; padding: 10px 6px; min-height: 48px; text-align: center; line-height: 1.25; }
.choice[aria-pressed="true"], .tag[aria-pressed="true"] {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
}
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 14px; padding: 6px 12px; border-radius: 999px; }
.choice:focus-visible, .tag:focus-visible, .btn:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}

details.words { font-size: 15px; }
details.words summary { cursor: pointer; color: var(--accent); font-weight: 600; }
dl.glossary { margin: 10px 0 0; display: grid; gap: 6px; }
dl.glossary div { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; }
dl.glossary dt { font-weight: 600; }
dl.glossary dd { margin: 0; }

.actions {
  position: sticky; bottom: 0; display: flex; justify-content: flex-end; align-items: center;
  gap: 12px; flex-wrap: wrap;
  padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 35%);
}
.actions .status { margin-right: auto; font-size: 14px; color: var(--muted); }
.btn {
  font-weight: 700; padding: 12px 22px; min-height: 48px; background: var(--accent);
  color: var(--accent-ink); border-color: var(--accent);
}
.btn.quiet { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

.answer { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; }
.answer h3 { margin: 0; font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; }

.code {
  font-family: var(--font-mono); font-size: 12px; line-height: 1.4; word-break: break-all;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
  max-height: 160px; overflow: auto; user-select: all;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

@media (max-width: 599px) {
  h1 { font-size: 26px; }
  .lines-head { display: none; }
  .line { grid-template-columns: 1fr; gap: 2px; }
  .line .k {
    position: static; width: auto; height: auto; overflow: visible; clip: auto;
    font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); margin-right: 6px;
  }
  .pair-head, .pline .cells { grid-template-columns: 1fr; gap: 6px; }
  dl.glossary div { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .bar > i { transition: none; }
}
</style>

  "use strict";

  const BANK = JSON.parse(document.getElementById("bank").textContent);
  const TEXT = BANK.text;
  const Q = TEXT.questions;
  const STORE_KEY = "bot-day-check:" + BANK.bank_version;
  const CODE_PREFIX = "BDC1-";
  const CODE_END = ".";
  const TECH = [["no", "No"], ["tech", "Yes, in tech"], ["security", "Yes, in security or IT"]];
  const AI_USE = [["never", "Never"], ["sometimes", "Sometimes"], ["often", "Often"]];
  const RETRY_MS = 1200;
  const app = document.getElementById("app");

  // ── helpers ────────────────────────────────────────────────────────────────
  function el(tag, attrs, ...kids) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return node;
  }
  function randomId() {
    const bytes = new Uint8Array(8);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
  }
  function seedFrom(text) {
    let h = 2166136261;
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function seededRandom(seed) {
    let s = seed;
    return () => {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(items, rand) {
    const out = items.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }
  const cardById = new Map(BANK.cards.map((c) => [c.id, c]));
  const pairById = new Map(BANK.pairs.map((p) => [p.id, p]));
  const shownRows = BANK.rows.filter((r) => r.shown !== false);

  // ── state ──────────────────────────────────────────────────────────────────
  function freshState() {
    const pid = randomId();
    const rand = seededRandom(seedFrom(pid));
    // the forms already keep strata apart and place the attention checks; never reshuffle one
    const form = BANK.forms[seedFrom("form:" + pid) % BANK.forms.length];
    const pairOrder = shuffled(BANK.pairs.map((p) => p.id), rand);
    const pairTop = {};
    for (const id of pairOrder) {
      const [a, b] = pairById.get(id).cards;
      pairTop[id] = rand() < 0.5 ? a.id : b.id;
    }
    return {
      screen: "welcome",
      pid,
      form: form.id,
      started: null,
      finished: null,
      background: { tech: null, ai_use: null },
      practiceIndex: 0,
      practiceShown: false,
      cardOrder: form.cards.slice(),
      cardIndex: 0,
      pairOrder,
      pairTop,
      pairIndex: 0,
      cards: {},
      pairs: {},
      draft: null,
      shownAt: 0,
      mobile: window.matchMedia("(max-width: 700px)").matches,
    };
  }
  let state = null;

  function loadLocal() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }
  function saveLocal() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage off */ }
  }

  function responseDoc() {
    return {
      pid: state.pid,
      bank_version: BANK.bank_version,
      form: state.form,
      started: state.started,
      finished: state.finished,
      background: state.background,
      cards: state.cards,
      pairs: state.pairs,
      mobile: state.mobile,
      rater: "human",
    };
  }
  function answerCode() {
    const bytes = new TextEncoder().encode(JSON.stringify(responseDoc()));
    let bin = "";
    bytes.forEach((b) => { bin += String.fromCharCode(b); });
    const body = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    return CODE_PREFIX + body + CODE_END;
  }

  // ── shared store (answers reach the researcher when this viewer may write) ──
  let saveStatus = "waiting"; // waiting | saved | offline | error
  let docExists = false;
  let saveChain = Promise.resolve();
  const storeReady = (async () => {
    const c = window.claude;
    if (!c || typeof c.use !== "function") return null;
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return null;
    const uid = await user.id();
    if (!uid) return null;
    return { db, uid };
  })().catch(() => null);

  function pause(ms) { return new Promise((r) => setTimeout(r, ms)); }
  async function writeOnce(store) {
    const ref = store.db.doc("responses/" + store.uid);
    // runs merge by pid, so several people answering on one device each keep their own run
    const body = { runs: { [state.pid]: responseDoc() }, updated: new Date().toISOString() };
    if (!docExists) {
      const snap = await ref.get();
      docExists = snap.exists;
    }
    if (docExists) await ref.update(body);
    else { await ref.set(body); docExists = true; }
  }
  function saveRemote() {
    saveChain = saveChain.then(async () => {
      const store = await storeReady;
      if (!store) { saveStatus = "offline"; paintStatus(); return; }
      try {
        await writeOnce(store);
        saveStatus = "saved";
      } catch (e) {
        if (e && e.code === "unavailable") {
          await pause(RETRY_MS + Math.random() * RETRY_MS);
          try { await writeOnce(store); saveStatus = "saved"; }
          catch (e2) { saveStatus = "error"; }
          paintStatus();
          return;
        }
        const refused = e && ["invalid_argument", "not_granted", "revoked",
          "capability_disabled", "capability_removed", "permission_denied"].includes(e.code);
        saveStatus = refused ? "offline" : "error";
      }
      paintStatus();
    }).then(() => { if (state.screen === "done") render(); }).catch(() => { /* keep the chain alive */ });
  }
  function persist() { saveLocal(); if (state.started) saveRemote(); }

  let statusNode = null;
  function statusText() {
    if (saveStatus === "saved") return "Answers saved";
    if (saveStatus === "offline") return "You will get an answer code at the end";
    if (saveStatus === "error") return "Saving failed; you will get an answer code at the end";
    return "";
  }
  function paintStatus() { if (statusNode) statusNode.textContent = statusText(); }

  // ── shared pieces ──────────────────────────────────────────────────────────
  let lastStep = null;
  function frame(stepText, progress, ...body) {
    const focusedId = document.activeElement && document.activeElement.id;
    const top = el("div", { class: "top" },
      el("span", { class: "brand", text: "Bot Day Check" }),
      stepText ? el("span", { class: "step", text: stepText }) : null);
    const bar = el("div", { class: "bar", "aria-hidden": "true" }, el("i"));
    bar.firstChild.style.width = Math.round(progress * 100) + "%";
    // replaceChildren would print an empty slot as the text "null"
    app.replaceChildren(top, bar, ...body.filter((part) => part !== null && part !== undefined));
    const stepKey = state.screen + "|" + stepText;
    if (stepKey !== lastStep) {
      lastStep = stepKey;
      window.scrollTo(0, 0);
    } else if (focusedId) {
      const again = document.getElementById(focusedId);
      if (again) again.focus({ preventScroll: true });
    }
  }
  function actions(...buttons) {
    statusNode = el("span", { class: "status", text: statusText() });
    return el("div", { class: "actions" }, statusNode, ...buttons);
  }
  function totalSteps() { return BANK.practice.length + BANK.cards.length + BANK.pairs.length; }
  function doneSteps() { return state.practiceIndex + state.cardIndex + state.pairIndex; }

  function glossaryList() {
    return el("dl", { class: "glossary" }, TEXT.glossary.map((g) => el("div", {},
      el("dt", { text: g.word }), el("dd", { text: g.means }))));
  }
  function wordList() {
    return el("details", { class: "words" },
      el("summary", { text: "Word list" }), glossaryList(),
      el("p", { class: "muted", style: "margin-top:8px", text: TEXT.glossary_note }));
  }
  function noteLines(card) {
    const notes = [];
    for (const key of ["calendar", "company"]) {
      if (card[key]) notes.push(el("div", { class: "note" },
        el("b", { text: TEXT.note_labels[key] + ": " }), card[key]));
    }
    return notes;
  }

  function dayCard(card) {
    const notes = noteLines(card);
    const lines = shownRows.map((r) => {
      const row = card.rows.find((x) => x.id === r.id);
      return el("div", { class: "line" },
        el("div", { class: "lab", text: r.label }),
        el("div", {}, el("span", { class: "k", text: "Usual" }), row.usual),
        el("div", {}, el("span", { class: "k", text: "Today" }), row.today));
    });
    return el("div", { class: "sheet" },
      el("div", {}, el("div", { class: "who", text: card.who }),
        el("div", { class: "when", text: "Day: " + card.day })),
      el("div", { class: "notes" },
        notes.length ? notes : el("div", { class: "note none", text: "No notes for this day." })),
      el("div", { class: "lines" },
        el("div", { class: "lines-head", "aria-hidden": "true" },
          el("span"), el("span", { text: "Usual for it" }), el("span", { text: "Today" })),
        lines),
      wordList());
  }

  function choiceGroup(name, legend, labels, value, onPick, extraClass) {
    const buttons = labels.map((label, i) => el("button", {
      type: "button", class: "choice", "aria-pressed": value === i ? "true" : "false",
      id: name + "-" + i, onclick: () => onPick(i), text: label,
    }));
    return el("fieldset", { role: "group", "aria-label": legend },
      el("legend", { text: legend }),
      el("div", { class: "choices" + (extraClass ? " " + extraClass : "") }, buttons));
  }

  function questions(draft, rerender) {
    const parts = [
      choiceGroup("unusual", "1. " + Q.unusual.text, Q.unusual.options, draft.unusual,
        (i) => { draft.unusual = i; if (i === 0) draft.stood_out = []; saveLocal(); rerender(); }),
      choiceGroup("check", "2. " + Q.check.text, Q.check.options, draft.check,
        (i) => { draft.check = i; saveLocal(); rerender(); }),
    ];
    if (draft.unusual !== null && draft.unusual > 0) {
      const tags = shownRows.map((r) => {
        const on = draft.stood_out.includes(r.id);
        return el("button", {
          type: "button", class: "tag", "aria-pressed": on ? "true" : "false", id: "tag-" + r.id,
          text: r.label,
          onclick: () => {
            draft.stood_out = on ? draft.stood_out.filter((x) => x !== r.id) : [...draft.stood_out, r.id];
            saveLocal(); rerender();
          },
        });
      });
      parts.push(el("fieldset", { role: "group", "aria-label": Q.stood_out.text },
        el("legend", { text: "3. " + Q.stood_out.text }),
        el("div", { class: "tags" }, tags)));
    }
    return el("div", { class: "sheet" }, parts);
  }

  function newDraft() { return { unusual: null, check: null, stood_out: [] }; }

  // ── screens ────────────────────────────────────────────────────────────────
  function welcome() {
    frame("", 0,
      el("div", { class: "stack" },
        el("h1", { text: "How unusual was this agent's day?" }),
        el("p", { class: "lead", text: "A study about how people judge the work of AI agents. Your answers help test a system that watches these agents." })),
      el("div", { class: "sheet stack" },
        el("ul", {},
          el("li", { text: "About 30 minutes, on a phone or a computer. You can take a break; your answers are kept on this device as you go." }),
          el("li", { text: BANK.practice.length + " practice cards, then " + BANK.cards.length + " cards and " + BANK.pairs.length + " pairs." }),
          el("li", { text: "We ask no name or contact details, only two questions about your background. Your answers are stored without your name and used in a research paper." }),
          el("li", { text: "Taking part is voluntary. You can stop at any time; ask the person who sent you this link if you want your answers removed." }),
          el("li", { text: "The agents, people and company on the cards are simulated for this study. None of them is real." }))),
      actions(el("button", {
        type: "button", class: "btn", id: "agree", text: "I agree, start",
        onclick: () => { state.started = new Date().toISOString(); state.screen = "background"; persist(); render(); },
      })));
  }

  function background() {
    const bg = state.background;
    const group = (name, legend, options, key) => el("fieldset", { role: "group", "aria-label": legend },
      el("legend", { text: legend }),
      el("div", { class: "choices" }, options.map(([value, label]) => el("button", {
        type: "button", class: "choice", id: name + "-" + value, "aria-pressed": bg[key] === value ? "true" : "false",
        text: label, onclick: () => { bg[key] = value; saveLocal(); background(); },
      }))));
    frame("About you", 0,
      el("h2", { text: "Two questions about you" }),
      el("div", { class: "sheet" },
        group("tech", "Is your job in tech?", TECH, "tech"),
        group("ai", "How often do you use AI chat tools, such as ChatGPT or Claude?", AI_USE, "ai_use")),
      actions(el("button", {
        type: "button", class: "btn", id: "bg-next", text: "Next",
        disabled: !(bg.tech && bg.ai_use),
        onclick: () => { state.screen = "intro"; persist(); render(); },
      })));
  }

  function intro() {
    frame("How it works", 0,
      el("h2", { text: "How it works" }),
      el("div", { class: "sheet stack" }, TEXT.intro.map((t) => el("p", { text: t }))),
      el("div", { class: "sheet stack" },
        el("h2", { text: "Word list" }),
        el("p", { class: "muted", text: "Every card has this list at the bottom, so you can look a word up at any time." }),
        glossaryList(),
        el("p", { class: "muted", text: TEXT.glossary_note })),
      actions(el("button", {
        type: "button", class: "btn", id: "intro-next", text: "Start the practice cards",
        onclick: () => { state.screen = "practice"; state.draft = newDraft(); state.shownAt = Date.now(); persist(); render(); },
      })));
  }

  function practice() {
    const card = BANK.practice[state.practiceIndex];
    const draft = state.draft || (state.draft = newDraft());
    const ready = draft.unusual !== null && draft.check !== null;
    const last = state.practiceIndex + 1 >= BANK.practice.length;
    const body = [];
    if (state.practiceIndex === 0) body.push(el("p", { class: "notice", text: TEXT.sections.practice }));
    body.push(dayCard(card), questions(draft, practice));
    let button;
    if (state.practiceShown) {
      const fb = card.feedback;
      body.push(el("div", { class: "answer" },
        el("h3", { text: "How we would answer" }),
        el("p", {}, "Question 1: ", el("b", { text: Q.unusual.options[fb.unusual] }),
          ". Question 2: ", el("b", { text: Q.check.options[fb.check] }), "."),
        el("p", { text: fb.why }),
        last ? el("p", { text: TEXT.sections.practice_after }) : null));
      button = el("button", {
        type: "button", class: "btn", id: "practice-continue",
        text: last ? "Start the real cards" : "Next practice card",
        onclick: () => {
          state.practiceIndex += 1; state.practiceShown = false; state.draft = newDraft(); state.shownAt = Date.now();
          if (state.practiceIndex >= BANK.practice.length) state.screen = "card";
          persist(); render();
        },
      });
    } else {
      button = el("button", {
        type: "button", class: "btn", id: "practice-check", text: "See how we would answer",
        disabled: !ready, onclick: () => { state.practiceShown = true; saveLocal(); practice(); },
      });
    }
    frame("Practice " + (state.practiceIndex + 1) + " of " + BANK.practice.length,
      doneSteps() / totalSteps(), ...body, actions(button));
  }

  function card() {
    const id = state.cardOrder[state.cardIndex];
    const c = cardById.get(id);
    const draft = state.draft || (state.draft = newDraft());
    const ready = draft.unusual !== null && draft.check !== null;
    const half = Math.floor(state.cardOrder.length / 2);
    let notice = null;
    if (state.cardIndex === 0) notice = el("p", { class: "notice", text: TEXT.sections.cards });
    else if (state.cardIndex === half) notice = el("p", { class: "notice", text: TEXT.sections.break });
    frame("Card " + (state.cardIndex + 1) + " of " + state.cardOrder.length, doneSteps() / totalSteps(),
      notice, dayCard(c), questions(draft, card),
      actions(el("button", {
        type: "button", class: "btn", id: "card-next", text: "Next", disabled: !ready,
        onclick: () => {
          state.cards[id] = {
            unusual: draft.unusual, check: draft.check,
            stood_out: draft.unusual > 0 ? draft.stood_out.slice() : [],
            ms: Date.now() - state.shownAt, order: state.cardIndex,
          };
          state.cardIndex += 1; state.draft = newDraft(); state.shownAt = Date.now();
          if (state.cardIndex >= state.cardOrder.length) state.screen = "pairs-intro";
          persist(); render();
        },
      })));
  }

  function pairsIntro() {
    frame("Last part", doneSteps() / totalSteps(),
      el("h2", { text: "Last part: " + BANK.pairs.length + " pairs" }),
      el("div", { class: "sheet stack" },
        el("p", { text: TEXT.sections.pairs }),
        el("p", { text: Q.pair.text })),
      actions(el("button", {
        type: "button", class: "btn", id: "pairs-start", text: "Show the first pair",
        onclick: () => { state.screen = "pair"; state.draft = { chose: null }; state.shownAt = Date.now(); persist(); render(); },
      })));
  }

  function pairChoice(ordered, draft, idSuffix) {
    return choiceGroup("pick" + idSuffix, Q.pair.text, Q.pair.options,
      ordered.findIndex((c) => c.id === draft.chose),
      (i) => { draft.chose = ordered[i].id; saveLocal(); pair(); }, "two");
  }

  function pair() {
    const id = state.pairOrder[state.pairIndex];
    const p = pairById.get(id);
    const topId = state.pairTop[id];
    const ordered = p.cards[0].id === topId ? p.cards : [p.cards[1], p.cards[0]];
    const draft = state.draft || (state.draft = { chose: null });
    const names = Q.pair.options;
    const heads = ordered.map((c, i) => el("div", { class: "stack", style: "gap:4px" },
      el("span", { class: "agent-chip", text: names[i] }),
      el("div", { class: "who", text: c.who }),
      noteLines(c)));
    const lines = shownRows.map((r) => el("div", { class: "pline" },
      el("div", { class: "lab", text: r.label }),
      el("div", { class: "cells" }, ordered.map((c, i) => {
        const row = c.rows.find((x) => x.id === r.id);
        return el("div", { class: "cell" },
          el("span", { class: "k", text: names[i] }),
          el("div", {}, el("span", { class: "muted", text: "Usual: " }), row.usual),
          el("div", {}, el("span", { class: "muted", text: "Today: " }), row.today));
      }))));
    frame("Pair " + (state.pairIndex + 1) + " of " + state.pairOrder.length, doneSteps() / totalSteps(),
      el("h2", { text: Q.pair.text }),
      el("div", { class: "sheet" },
        el("div", { class: "when", text: "Day: " + ordered[0].day }),
        el("div", { class: "pair-head" }, heads),
        el("div", {}, lines),
        wordList()),
      el("div", { class: "sheet" }, pairChoice(ordered, draft, "")),
      actions(el("button", {
        type: "button", class: "btn", id: "pair-next",
        text: state.pairIndex + 1 < state.pairOrder.length ? "Next pair" : "Finish",
        disabled: draft.chose === null,
        onclick: () => {
          state.pairs[id] = { chose: draft.chose, top: topId, ms: Date.now() - state.shownAt, order: state.pairIndex };
          state.pairIndex += 1; state.draft = { chose: null }; state.shownAt = Date.now();
          if (state.pairIndex >= state.pairOrder.length) {
            state.screen = "done"; state.finished = new Date().toISOString();
          }
          persist(); render();
        },
      })));
  }

  function done() {
    const code = answerCode();
    const codeBox = el("div", { class: "code", id: "answer-code", tabindex: "0", text: code });
    const copied = el("span", { class: "muted", role: "status" });
    const copy = el("button", {
      type: "button", class: "btn quiet", id: "copy-code", text: "Copy answer code",
      onclick: () => {
        const selectIt = () => {
          const range = document.createRange(); range.selectNodeContents(codeBox);
          const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
          copied.textContent = "Selected. Copy it with your device's copy command.";
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(() => { copied.textContent = "Copied."; }, selectIt);
        } else selectIt();
      },
    });
    const saved = saveStatus === "saved";
    frame("Done", 1,
      el("div", { class: "stack" },
        el("h1", { text: "Thank you" }),
        el("p", { class: "lead", text: saved
          ? "Your answers are saved. You can close this page."
          : "One last step: copy your answer code and send it to the person who gave you this link, by email or message." })),
      el("div", { class: "sheet stack" },
        el("h2", { text: saved ? "Backup answer code" : "Your answer code" }),
        el("p", { class: "muted", text: saved
          ? "Not needed, since your answers are saved. Keep it only if you were asked to."
          : "It holds only your answers, not your name. Copy all of it, up to the full stop at the end." }),
        codeBox,
        el("div", { class: "row" }, copy, copied)),
      actions(el("button", {
        type: "button", class: "btn quiet", id: "next-person", text: "Start again for another person",
        onclick: () => { state = freshState(); saveLocal(); render(); },
      })));
  }

  const SCREENS = {
    welcome, background, intro, practice, card, "pairs-intro": pairsIntro, pair, done,
  };
  function render() { (SCREENS[state.screen] || welcome)(); }

  // ── boot ───────────────────────────────────────────────────────────────────
  function start(data) {
    const kept = data && data.state;
    state = kept || loadLocal() || freshState();
    if (!state.draft && (state.screen === "card" || state.screen === "practice")) state.draft = newDraft();
    render();
    storeReady.then((store) => {
      if (!store) { saveStatus = "offline"; paintStatus(); if (state.screen === "done") render(); return; }
      if (state.started) saveRemote();
    });
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ state }));
  if (hot && typeof hot.ready === "function") hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
